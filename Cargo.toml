[package]
name = "minecraft-but-optimized"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A Minecraft-like voxel engine built from scratch in Rust, optimized for performance."
repository = "https://github.com/Artificial-IntelligenceAI/minecraft-but-optimized"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
bevy_ecs = "0.19.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glam = "0.32.1"
glyphon = "0.12.0"
log = "0.4.33"
noise = "0.9.0"
pollster = "1.0.1"
rayon = "1.12.0"
wgpu = "30.0.0"
winit = "0.30.13"
